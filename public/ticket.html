<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ticket Detail</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
  a { text-decoration: none; color: #337ab7; }
  .field { margin-bottom: 10px; }
  .field label { font-weight: bold; display: block; font-size: 12px; color: #555; }
  form { display: grid; gap: 8px; margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 6px; }
  select, textarea, button { padding: 6px; font-size: 14px; }
  ul { padding-left: 18px; }
  li { margin-bottom: 6px; font-size: 13px; }
  #msg { font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>

<a href="/">&larr; Back to all tickets</a>
<h1 id="ticketTitle">Loading...</h1>

<div id="ticketDetails"></div>

<h2>Update Ticket</h2>
<form id="updateForm">
  <div class="field">
    <label>Status</label>
    <select id="status">
      <option value="new">New</option>
      <option value="assigned">Assigned</option>
      <option value="in_progress">In Progress</option>
      <option value="pending">Pending</option>
      <option value="resolved">Resolved</option>
      <option value="closed">Closed</option>
      <option value="escalated">Escalated</option>
    </select>
  </div>
  <div class="field">
    <label>Priority</label>
    <select id="priority">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
  </div>
  <div class="field">
    <label>Assign To (Staff)</label>
    <select id="assigned_to">
      <option value="">Unassigned</option>
    </select>
  </div>
  <div class="field">
    <label>Resolution Notes</label>
    <textarea id="resolution_notes"></textarea>
  </div>
  <button type="submit">Save Update</button>
  <div id="msg"></div>
</form>

<h2>Activity History</h2>
<ul id="historyList"></ul>

<script>
const API = '/api';
const params = new URLSearchParams(window.location.search);
const ticketId = params.get('id');

async function loadStaff() {
  const res = await fetch(`${API}/users?role=staff`);
  const data = await res.json();
  const select = document.getElementById('assigned_to');
  data.users.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u.id;
    opt.textContent = u.name;
    select.appendChild(opt);
  });
}

async function loadTicket() {
  const res = await fetch(`${API}/tickets/${ticketId}`);
  const data = await res.json();

  if (!res.ok) {
    document.getElementById('ticketTitle').textContent = 'Ticket not found';
    return;
  }

  const t = data.ticket;
  document.getElementById('ticketTitle').textContent = `Ticket #${t.id}: ${t.title}`;
  document.getElementById('ticketDetails').innerHTML = `
    <p><strong>Description:</strong> ${t.description || '-'}</p>
    <p><strong>Category:</strong> ${t.category}</p>
    <p><strong>Created by (user id):</strong> ${t.created_by}</p>
    <p><strong>Due by:</strong> ${new Date(t.due_by).toLocaleString()}</p>
    <p><strong>Created at:</strong> ${t.created_at}</p>
  `;

  document.getElementById('status').value = t.status;
  document.getElementById('priority').value = t.priority;
  document.getElementById('assigned_to').value = t.assigned_to || '';
  document.getElementById('resolution_notes').value = t.resolution_notes || '';

  const historyList = document.getElementById('historyList');
  historyList.innerHTML = '';
  data.history.forEach(h => {
    const li = document.createElement('li');
    li.textContent = `[${h.changed_at}] ${h.change_note}`;
    historyList.appendChild(li);
  });
}

document.getElementById('updateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    status: document.getElementById('status').value,
    priority: document.getElementById('priority').value,
    assigned_to: document.getElementById('assigned_to').value ? Number(document.getElementById('assigned_to').value) : null,
    resolution_notes: document.getElementById('resolution_notes').value
  };

  const res = await fetch(`${API}/tickets/${ticketId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();

  const msg = document.getElementById('msg');
  if (res.ok) {
    msg.textContent = 'Ticket updated successfully.';
    msg.style.color = 'green';
    loadTicket();
  } else {
    msg.textContent = data.message;
    msg.style.color = 'red';
  }
});

loadStaff().then(loadTicket);
</script>

</body>
</html>
